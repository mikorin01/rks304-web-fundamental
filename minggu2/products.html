<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
<header class="bg-indigo-500 text-indigo-100 px-6 py-4 flex justify-between items-center">
  <h1 class="text-xl font-bold">belajartailwind.com</h1>
  <a href="index.html" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700"> Logout </a>
</header>
<div class="grid grid-cols-8 min-h-[calc(100vh-68px)]">
  <aside class="col-span-1 bg-gray-100 border-r p-4">
    <nav class="space-y-2">
      <a href="template.html" class="block px-4 py-3 rounded-lg text-gray-600 hover:bg-indigo-500 hover:text-white">Dashboard</a>
      <a href="products.html" class="block px-4 py-3 rounded-lg bg-indigo-500 text-white">Product</a>
      <a href="user.html" class="block px-4 py-3 rounded-lg text-gray-600 hover:bg-indigo-500 hover:text-white">User</a>
      <a href="setting.html" class="block px-4 py-3 rounded-lg text-gray-600 hover:bg-indigo-500 hover:text-white">Setting</a>
    </nav>
  </aside>
  <main class="col-span-7 bg-white p-8">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold text-gray-800">Manajemen Produk</h2>
      <a href="add-produk.html" class="bg-indigo-500 text-white px-4 py-2 rounded-lg hover:bg-indigo-600">+ Add Product</a>
    </div>
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-100 text-gray-600">
          <th class="py-3 px-4">No</th>
          <th class="py-3 px-4">Name</th>
          <th class="py-3 px-4">Stock</th>
          <th class="py-3 px-4">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 px-4">1</td>
          <td class="py-3 px-4">Kaos Polos</td>
          <td class="py-3 px-4">120</td>
          <td class="py-3 px-4 space-x-2">
            <a href="edit-produk.html" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">Edit</a>
            <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</button>
          </td>
        </tr>
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 px-4">2</td>
          <td class="py-3 px-4">Celana Jeans</td>
          <td class="py-3 px-4">75</td>
          <td class="py-3 px-4 space-x-2">
            <a href="edit-produk.html" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">Edit</a>
            <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</button>
          </td>
        </tr>
        <tr class="hover:bg-gray-50">
          <td class="py-3 px-4">3</td>
          <td class="py-3 px-4">Topi Baseball</td>
          <td class="py-3 px-4">40</td>
          <td class="py-3 px-4 space-x-2">
            <a href="edit-produk.html" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">Edit</a>
            <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
