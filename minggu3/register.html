<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script/validasi_input.js", defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-200 min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">
            Register
        </h1>
        <form id="registerForm" action="dashboard.html">
            <!-- Username -->
            <div class="mb-4">
                <label for="username" class="block mb-1 font-medium">
                    Username
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="w-full border rounded px-3 py-2"
                >
                <p id="usernameError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="block mb-1 font-medium">
                    Password
                </label>
                <div class="relative">
        <input
            type="password"
            id="password"
            name="password"
            class="w-full border rounded px-3 py-2 pr-10"
        >

        <button
            type="button"
            id="togglePassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"
        >
            <svg
                id="eyeIcon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12z"
                />
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
                />
            </svg>
        </button>
    </div>
    <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
</div>
            <!-- Nama -->
            <div class="mb-4">
                <label for="nama" class="block mb-1 font-medium">
                    Nama
                </label>
                <input type="text" id="nama" name="nama" class="w-full border rounded px-3 py-2"
                >
                <p id="namaError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Tanggal Lahir -->
            <div class="mb-4">
                <label for="tanggalLahir" class="block mb-1 font-medium">
                    Tanggal Lahir
                </label>
                <input
                    type="date"
                    id="tanggalLahir"
                    name="tanggalLahir"
                    class="w-full border rounded px-3 py-2"
                >
                <p id="tanggalLahirError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Alamat -->
            <div class="mb-4">
                <label for="alamat" class="block mb-1 font-medium">
                    Alamat
                </label>
                <textarea
                    id="alamat"
                    name="alamat"
                    class="w-full border rounded px-3 py-2"
                    rows="3"
                ></textarea>
                <p id="alamatError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Nomor Telepon -->
            <div class="mb-6">
                <label for="telepon" class="block mb-1 font-medium">
                    Nomor Telepon
                </label>
                <input
                    type="text"
                    id="telepon"
                    name="telepon"
                    class="w-full border rounded px-3 py-2"
                    placeholder="+62xxxxxxxxxx"
                >
                <p id="teleponError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <button
                type="submit"
                class="w-full bg-blue-500 text-white py-2 rounded hover:bg-indigo-600"
            >
                Register
            </button>
        </form>
    </div>
</body>
</html>
</body>
</html>
