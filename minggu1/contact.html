<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Raisya Tri Hapsari</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="contact-page">
    <header>
        <div class="logo"><a href="index.html">RTH</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Me</h2>
            <p>Feel free to reach out to me through my social media or send me a message using the form below.</p>

            <div class="contact-grid">
            <div class="contact-card">
                <h3>Find Me Online</h3>
                <p><i class="ti ti-mail logo"></i><a href="mailto:raisyatrihapsari@email.com">raisyatrihapsari@email.com</a></p>
                <p><i class="ti ti-brand-linkedin logo"></i><a href="https://www.linkedin.com/in/raisya-tri-hapsari/" target="_blank">LinkedIn</a></p>
                <p><i class="ti ti-brand-github logo"></i><a href="https://github.com/mikorin01" target="_blank">GitHub</a></p>
            </div>

            <div class="contact-card">
                <h3>Send Me a Message</h3>
                <form class="contact-form" id="contactForm">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="category">Kategori / Keperluan</label>
                    <select id="category" name="category">
                        <option value="consultation">Konsultasi</option>
                        <option value="collaboration">Kolaborasi Proyek</option>
                        <option value="general">Pertanyaan Umum</option>
                    </select>

                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit">Kirim Pesan</button>
                </form>
                <div class="success-popup" id="successPopup">
                <div class="success-box">
                    <i class="ti ti-circle-check"></i>
                    <h3>Message Sent!</h3>
                    <p>Thank you for reaching out. I'll get back to you soon.</p>
                    <button type="button" id="closePopup">Close</button>
                </div>
                </div>
            </div>
        </section>
        <script>
            const form = document.getElementById("contactForm");
            const popup = document.getElementById("successPopup");
            const closePopup = document.getElementById("closePopup");

            form.addEventListener("submit", function(e) {
                e.preventDefault();
                popup.classList.add("show");
                form.reset();
            });

            closePopup.addEventListener("click", function() {
                popup.classList.remove("show");
            });
            </script>   
</body>
</html>
