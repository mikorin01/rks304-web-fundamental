<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Raisya Tri Hapsari</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <!-- Header & Navigation -->
    <header>
       <div class="logo">
        <a href="index.html">RTH</a>
       </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>


    <main>

        <!-- Contact Section -->
        <section>
            <h2>Contact Me</h2>

            <p>
                Feel free to reach out to me through my social media
                or send me a message using the form below.
            </p>

            <!-- Social Links -->
            <div>
                <h3>Find Me Online</h3>

                <p>
                    <strong>Email:</strong>
                    <a href="mailto:raisyatrihapsari@email.com">raisyatrihapsari@email.com</a>
                </p>

                <p>
                    <strong>LinkedIn:</strong>
                    <a href="https://www.linkedin.com/in/raisya-tri-hapsari/" target="_blank">
                        LinkedIn
                    </a>
                </p>

                <p>
                    <strong>GitHub:</strong>
                    <a href="https://github.com/mikorin01" target="_blank">
                        GitHub
                    </a>
                </p>
            </div>


            <!-- Contact Form -->
            <div>
                <h3>Send Me a Message</h3>

                <form action="#" method="post">

                    <label for="name">Nama Lengkap</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                    <label for="email">Alamat Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                    <label for="category">Kategori / Keperluan</label>
                    <select id="category" name="category">
                        <option value="collaboration">Kolaborasi Proyek</option>
                        <option value="general">Pertanyaan Umum</option>
                    </select>

                    <label for="message">Pesan</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                    ></textarea>

                    <button type="submit">Kirim Pesan</button>

                </form>
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Raisya Tri Hapsari</p>
    </footer>

</body>
</html>
